0" text-anchor="start">proposed tenant</text><text x="52" y="677" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59645c" font-weight="400" text-anchor="start">service.</text><text x="52" y="874" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#235e43" font-weight="600" text-anchor="start">No productivity ranks</text><rect x="264" y="158" width="1144" height="54" rx="8" fill="#ffffff" stroke="#d7ded6"/><text x="284" y="181" font-family="monospace" font-size="12" fill="#121714" font-weight="600" text-anchor="start">11–17 NOV 2026</text><text x="284" y="200" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#59645c" font-weight="400" text-anchor="start">Start inclusive 11 Nov · End exclusive 18 Nov</text><rect x="664" y="171" width="112" height="26" rx="13" fill="#e8ede6" stroke="#e8ede6"/><text x="676" y="189" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#235e43" font-weight="600" text-anchor="start">UTC · DAILY</text><text x="799" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59645c" font-weight="400" text-anchor="start">No comparison — baseline not supplied</text><text x="1388" y="183" font-family="monospace" font-size="10" fill="#59645c" font-weight="400" text-anchor="end">AS OF 18 NOV 06:00Z</text><rect x="264" y="234" width="268" height="108" rx="10" fill="#ffffff" stroke="#d7ded6"/><text x="284" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59645c" font-weight="600" text-anchor="start">DUPLICATE DELIVERY</text><text x="284" y="300" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#121714" font-weight="600" text-anchor="start">1</text><text x="284" y="325" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#59645c" font-weight="400" text-anchor="start">Suppressed from canonical request count</text><rect x="556" y="234" width="268" height="108" rx="10" fill="#ffffff" stroke="#d7ded6"/><text x="576" y="261" font-family
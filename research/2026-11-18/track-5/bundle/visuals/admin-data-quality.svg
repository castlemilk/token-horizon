<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">Data quality — proposed analytics wireframe</title><desc id="desc">Original synthetic illustration. No implemented or live product data. Fixed UTC window 11 through 17 November 2026.</desc><defs><pattern id="gap" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M0 8L8 0" stroke="#d7ded6" stroke-width="1"/></pattern><pattern id="partial" patternUnits="userSpaceOnUse" width="7" height="7"><path d="M0 7L7 0" stroke="#b6f2cf" stroke-width="1" opacity=".7"/></pattern></defs><rect x="0" y="0" width="1440" height="980" rx="0" fill="#f3f4ef" stroke="#f3f4ef"/><rect x="0" y="0" width="1440" height="42" rx="0" fill="#121714" stroke="#121714"/><text x="32" y="27" font-family="monospace" font-size="12" fill="#b6f2cf" font-weight="600" text-anchor="start">PROPOSAL • SYNTHETIC DATA • NOT IMPLEMENTED</text><text x="1408" y="27" font-family="monospace" font-size="11" fill="#d3dcd3" font-weight="400" text-anchor="end">TRACK 05 / ANALYTICS STUDY</text><text x="32" y="88" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#235e43" font-weight="600" text-anchor="start">◌</text><text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#121714" font-weight="600" text-anchor="start">TOKEN HORIZON</text><text x="32" y="112" font-family="monospace" font-size="10" fill="#59645c" font-weight="400" text-anchor="start">ANALYTICS PROPOSAL</text><text x="264" y="106" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#121714" font-weight="600" text-anchor="start">Data quality</text><text x="264" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#59645c" font-weight="400" text-anchor="start">Explain what the dashboard can support before generating comparisons or advisories.</text><rect x="32" y="156" width="204" height="752" rx="12" fill="#edf0e9" stroke="#d7ded6"/><tex
 comparable-period advisory.</text><rect x="264" y="473" width="740" height="249" rx="10" fill="#ffffff" stroke="#d7ded6"/><text x="286" y="504" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#121714" font-weight="600" text-anchor="start">Capture coverage by day</text><rect x="286" y="530" width="82" height="74" rx="7" fill="#235e43" stroke="#235e43"/><text x="327" y="557" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">11 NOV</text><text x="327" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Reported</text><rect x="385" y="530" width="82" height="74" rx="7" fill="#235e43" stroke="#235e43"/><text x="426" y="557" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">12 NOV</text><text x="426" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Reported</text><rect x="484" y="530" width="82" height="74" rx="7" fill="#d2bc89" stroke="#d2bc89"/><text x="525" y="557" font-family="monospace" font-size="11" fill="#121714" font-weight="600" text-anchor="middle">13 NOV</text><text x="525" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#121714" font-weight="600" text-anchor="middle">Partial</text><rect x="583" y="530" width="82" height="74" rx="7" fill="#e8ede6" stroke="#e8ede6"/><text x="624" y="557" font-family="monospace" font-size="11" fill="#121714" font-weight="600" text-anchor="middle">14 NOV</text><text x="624" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#121714" font-weight="600" text-anchor="middle">Unknown</text><rect x="682" y="530" width="82" height="74" rx="7" fill="#235e43" stroke="#235e43"/><text x="723" y="557" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">15 NOV</text><text x="723" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Zero</text><rect x="781" y="530" width="82" height="74" rx="7" fill="#235e43" stroke="#235e43"/><text x="822" y="557" font-family="monospace" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">16 NOV</text><text x="822" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Reported</text><rect x="880" y="530" width="82" height="74" rx="7" fill="#d2bc89" stroke="#d2bc89"/><text x="921" y="557" font-family="monospace" font-size="11" fill="#121714" font-weight="600" text-anchor="middle">17 NOV</text><text x="921" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#121714" font-weight="600" text-anchor="middle">Partial</text><text x="286" y="645" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">13 and 17 Nov: partial. 14 Nov: unknown. 15 Nov: a reported zero remains distinct</text><text x="286" y="667" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">from a missing bucket.</text><rect x="1024" y="473" width="384" height="249" rx="10" fill="#ffffff" stroke="#d7ded6"/><text x="1046" y="504" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#121714" font-weight="600" text-anchor="start">Controls that must hold</text><text x="1046" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#121714" font-weight="400" text-anchor="start">Tenant scope on every read and export. Role</text><text x="1046" y="566" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#121714" font-weight="400" text-anchor="start">checks enforced on the server. Redaction</text><text x="1046" y="590" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#121714" font-weight="400" text-anchor="start">before aggregation.</text><text x="1046" y="644" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59645c" font-weight="400" text-anchor="start">Role preview is an illustration. It does</text><text x="1046" y="665" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59645c" font-weight="400" text-anchor="start">not implement authentication.</text><rect x="264" y="746" width="740" height="163" rx="10" fill="#ffffff" stroke="#d7ded6"/><text x="286" y="776" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#121714" font-weight="600" text-anchor="start">Reconciliation</text><text x="286" y="812" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">Canonical requests</text><text x="976" y="812" font-family="monospace" font-size="18" fill="#121714" font-weight="600" text-anchor="end">29</text><text x="286" y="842" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">Observed tokens</text><text x="976" y="842" font-family="monospace" font-size="18" fill="#121714" font-weight="600" text-anchor="end">2,960,000</text><text x="286" y="879" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59645c" font-weight="400" text-anchor="start">Publication gaps must survive charting, comparison and export.</text><rect x="1024" y="746" width="384" height="163" rx="10" fill="#ffffff" stroke="#d7ded6"/><text x="1046" y="776" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#121714" font-weight="600" text-anchor="start">Privacy and retention</text><text x="1046" y="811" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">No prompts, credentials or raw local paths.</text><text x="1046" y="833" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">Withheld costs stay unavailable. Retention</text><text x="1046" y="855" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59645c" font-weight="400" text-anchor="start">policy needs a tenant contract.</text><text x="264" y="944" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#59645c" font-weight="400" text-anchor="start">PROPOSAL · synthetic admin evidence · policy checks and advisories shown here are unimplemented requirements</text></svg>
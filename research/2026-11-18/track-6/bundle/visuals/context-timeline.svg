<title id="title">Context across a session — proposed synthetic wireframe</title><desc id="description">Six request inputs are 28000, 44000, 70000, 84000, 24000, and 31000 tokens. Latest request input is 24.2 percent of an illustrative 128000 combined window. Configured output allowance is 16000; not observed usage or physical reservation. Client planning headroom is 81000. Provider admission may use a different allowance. Cumulative input is 281000. Explicit harness-reported compaction follows request four. Compaction token usage is unavailable. Proposed. Synthetic data. Not implemented.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">One request, reconciled — proposed synthetic wireframe</title><desc id="description">Synthetic Anthropic-style additive-cache fixture. Raw input 500, cache read 8000, cache write 1500 with 1000 five-minute and 500 one-hour writes. Gross output 2000 includes 1500 thinking tokens. Inclusive input 10000 and normalized total 12000. Content capture off. Proposed. Synthetic data. Not implemented.</desc>
<defs><pattern id="reserve" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#dce9df"/><line x1="0" y1="0" x2="0" y2="7" stroke="#789b85" stroke-width="2"/></pattern><pattern id="unknown" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#f3f4ef"/><circle cx="3" cy="3" r="1" fill="#89958d"/></pattern></defs>
<g font-family="Arial,Helvetica,sans-serif" style="font-variant-numeric:tabular-nums"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f3f4ef" stroke="#f3f4ef"/><rect x="0" y="0" width="1440" height="85" rx="0" fill="#121714" stroke="#121714"/><circle cx="64" cy="42" r="18" fill="#b6f2cf"/><circle cx="69" cy="37" r="16" fill="#121714"/><line x1="43" y1="46" x2="86" y2="46" stroke="#b6f2cf" stroke-width="1.5"/><text x="102" y="49" font-size="23" fill="#f3f4ef" font-weight="600" text-anchor="start">Token Horizon</text><text x="296" y="49" font-size="15" fill="#cdd3cc" font-weight="400" text-anchor="start">/  Diagnostics  /  Reconciliation</text><rect x="984" y="27" width="408" height="30" rx="15" fill="#235e43" stroke="#235e43"/><text x="1188.0" y="47" font-size="12" fill="#f3f4ef" font-weight="600" text-anchor="middle">PROPOSED • SYNTHETIC DATA • NOT IMPLEMENTED</text><text x="48" y="138" font-size="32" fill="#121714" font-weight="600" text-anchor="start">One request, reconciled</text><text x="48" y="169" font-size="16" fill="#526057" font-weight="400" text-anchor="start">Synthetic Anthropic-style fixture • declared additive-cache semantics • request synthetic-a17</text><rect x="48" y="199" width="432" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="68" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Inclusive request input</text><text x="68" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">10,000</text><text x="68" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">500 uncached + 8,000 read + 1,500 write</text><rect x="504" y="199" width="432" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="524" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Gross output</text><text x="524" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">2,000</text><text x="524" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">Includes 1,500 reported thinking tokens</text><rect x="960" y="199" width="432" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="980" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Normalized total</text><text x="980" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">12,000</text><text x="980" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">10,000 input + 2,000 output</text><rect x="48" y="350" width="674" height="378" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="72" y="383" font-size="20" fill="#121714" font-weight="600" text-anchor="start">Provider-reported fields</text><rect x="528" y="365" width="170" height="30" rx="15" fill="#f3f4ef" stroke="#f3f4ef"/><text x="613.0" y="385" font-size="12" fill="#235e43" font-weight="600" text-anchor="middle">BODIES OFF</text><text x="72" y="428" font-size="15" fill="#121714" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">input_tokens</text><text x="698" y="428" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">500</text><line x1="72" y1="442" x2="698" y2="442" stroke="#cdd3cc" stroke-width="1"/><text x="72" y="472" font-size="15" fill="#121714" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">cache_read_input_tokens</text><text x="698" y="472" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">8,000</text><line x1="72" y1="486" x2="698" y2="486" stroke="#cdd3cc" stroke-width="1"/><text x="72" y="516" font-size="15" fill="#121714" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">cache_creation_input_tokens</text><text x="698" y="516" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1,500</text><line x1="72" y1="530" x2="698" y2="530" stroke="#cdd3cc" stroke-width="1"/><text x="72" y="560" font-size="15" fill="#526057" font-weight="400" text-anchor="start">  5-minute / 1-hour write split</text><text x="698" y="560" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1,000 / 500</text><line x1="72" y1="574" x2="698" y2="574" stroke="#cdd3cc" stroke-width="1"/><text x="72" y="604" font-size="15" fill="#121714" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">output_tokens</text><text x="698" y="604" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">2,000</text><line x1="72" y1="618" x2="698" y2="618" stroke="#cdd3cc" stroke-width="1"/><text x="72" y="648" font-size="15" fill="#526057" font-weight="400" text-anchor="start">  thinking_tokens within output</text><text x="698" y="648" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1,500</text><text x="72" y="708" font-size="13" fill="#526057" font-weight="400" text-anchor="start">TTL split is within the 1,500 writes; it is not another token total.</text><rect x="746" y="350" width="646" height="378" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="770" y="383" font-size="20" fill="#121714" font-weight="600" text-anchor="start">Normalized exclusive buckets</text><text x="1368" y="383" font-size="14" fill="#526057" font-weight="400" text-anchor="end">12,000 tokens</text><rect x="770" y="409" width="24.916666666666668" height="35" rx="0" fill="#235e43" stroke="#ffffff"/><rect x="794.9166666666666" y="409" width="398.6666666666667" height="35" rx="0" fill="#64977b" stroke="#ffffff"/><rect x="1193.5833333333333" y="409" width="74.75" height="35" rx="0" fill="#aed3b9" stroke="#ffffff"/><rect x="1268.3333333333333" y="409" width="24.916666666666668" height="35" rx="0" fill="#a2acbf" stroke="#ffffff"/><rect x="1293.25" y="409" width="74.75" height="35" rx="0" fill="#566d9a" stroke="#ffffff"/><rect x="771" y="470" width="13" height="13" rx="2" fill="#235e43" stroke="#235e43"/><text x="798" y="481" font-size="15" fill="#121714" font-weight="400" text-anchor="start">Uncached input</text><text x="1368" y="481" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">500</text><rect x="771" y="510" width="13" height="13" rx="2" fill="#64977b" stroke="#64977b"/><text x="798" y="521" font-size="15" fill="#121714" font-weight="400" text-anchor="start">Cache read</text><text x="1368" y="521" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">8,000</text><rect x="771" y="550" width="13" height="13" rx="2" fill="#aed3b9" stroke="#aed3b9"/><text x="798" y="561" font-size="15" fill="#121714" font-weight="400" text-anchor="start">Cache write</text><text x="1368" y="561" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1,500</text><rect x="771" y="590" width="13" height="13" rx="2" fill="#a2acbf" stroke="#a2acbf"/><text x="798" y="601" font-size="15" fill="#121714" font-weight="400" text-anchor="start">Other output</text><text x="1368" y="601" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">500</text><rect x="771" y="630" width="13" height="13" rx="2" fill="#566d9a" stroke="#566d9a"/><text x="798" y="641" font-size="15" fill="#121714" font-weight="400" text-anchor="start">Reported thinking</text><text x="1368" y="641" font-size="17" fill="#121714" font-weight="600" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1,500</text><line x1="770" y1="674" x2="1368" y2="674" stroke="#cdd3cc" stroke-width="1"/><text x="770" y="702" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Other output = 2,000 − 1,500 = 500</text><rect x="48" y="748" width="674" height="77" rx="10" fill="#f3f4ef" stroke="#cdd3cc"/><text x="72" y="778" font-size="16" fill="#121714" font-weight="600" text-anchor="start">Thinking is a subset of output.</text><text x="72" y="804" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Reported counts do not expose hidden reasoning content.</text><rect x="746" y="748" width="646" height="77" rx="10" fill="#f3f4ef" stroke="#cdd3cc"/><text x="770" y="778" font-size="16" fill="#121714" font-weight="600" text-anchor="start">Cache remains part of input context.</text><text x="770" y="804" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Tariff-specific estimates are separate from an invoice.</text><line x1="48" y1="845" x2="1392" y2="845" stroke="#cdd3cc" stroke-width="1"/><text x="48" y="873" font-size="13" fill="#526057" font-weight="400" text-anchor="start">Synthetic IDs only • tariff rates must resolve by provider, offer, API version and cache TTL.</text><text x="1392" y="873" font-size="12" fill="#235e43" font-weight="600" text-anchor="end">PROPOSED • SYNTHETIC DATA • NOT IMPLEMENTED</text></g></svg>
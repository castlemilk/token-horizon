<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Coverage before conclusions — proposed synthetic wireframe</title><desc id="description">Synthetic observed attempts total 40, with 37 final usage, 2 partial, and 1 missing. Only observed traffic is covered. Of 37 complete observations, 32 are priced and 5 are unpriced. Known priced subtotal is synthetic 0.086 USD under tariff SYN-v1, not an invoice. Reasoning share not reported, not zero. Proposed. Synthetic data. Not implemented.</desc>
<defs><pattern id="reserve" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#dce9df"/><line x1="0" y1="0" x2="0" y2="7" stroke="#789b85" stroke-width="2"/></pattern><pattern id="unknown" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#f3f4ef"/><circle cx="3" cy="3" r="1" fill="#89958d"/></pattern></defs>
<g font-family="Arial,Helvetica,sans-serif" style="font-variant-numeric:tabular-nums"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f3f4ef" stroke="#f3f4ef"/><rect x="0" y="0" width="1440" height="85" rx="0" fill="#121714" stroke="#121714"/><circle cx="64" cy="42" r="18" fill="#b6f2cf"/><circle cx="69" cy="37" r="16" fill="#121714"/><line x1="43" y1="46" x2="86" y2="46" stroke="#b6f2cf" stroke-width="1.5"/><text x="102" y="49" font-size="23" fill="#f3f4ef" font-weight="600" text-anchor="start">Token Horizon</text><text x="296" y="49" font-size="15" fill="#cdd3cc" font-weight="400" text-anchor="start">/  Diagnostics  /  Coverage and cost</text><rect x="984" y="27" width="408" height="30" rx="15" fill="#235e43" stroke="#235e43"/><text x="1188.0" y="47" font-size="12" fill="#f3f4ef" font-weight="600" text-anchor="middle">PROPOSED • SYNTHETIC DATA • NOT IMPLEMENTED</text><text x="48" y="138" font-size="32" fill="#121714" font-weight="600" text-anchor="start">Coverage before conclusions</text><text x="48" y="169" font-size="16" fill="#526057" font-weight="400" text-anchor="start">Local gateway • synthetic reporting window • observed traffic only; other traffic may be unseen.</text><rect x="48" y="199" width="318" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="68" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Observed attempts</text><text x="68" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">40</text><text x="68" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">Scope is this observer only</text><rect x="390" y="199" width="318" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="410" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Final usage received</text><text x="410" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">37 / 40</text><text x="410" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">92.5% • incomplete responses stay visible</text><rect x="732" y="199" width="318" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="752" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Known priced subtotal</text><text x="752" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">$0.086</text><text x="752" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">Synthetic USD • estimate • not invoice</text><rect x="1074" y="199" width="318" height="126" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="1094" y="228" font-size="14" fill="#526057" font-weight="600" text-anchor="start">Unpriced complete usage</text><text x="1094" y="271" font-size="34" fill="#121714" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="1094" y="301" font-size="13" fill="#526057" font-weight="400" text-anchor="start">Tariff missing • not zero cost</text><rect x="48" y="350" width="894" height="228" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="72" y="384" font-size="20" fill="#121714" font-weight="600" text-anchor="start">Usage completeness</text><text x="918" y="384" font-size="14" fill="#526057" font-weight="400" text-anchor="end">40 observed attempts</text><rect x="72" y="411" width="782.55" height="32" rx="0" fill="#235e43" stroke="#ffffff"/><rect x="854.55" y="411" width="42.3" height="32" rx="0" fill="#a89170" stroke="#ffffff"/><rect x="896.8499999999999" y="411" width="21.15" height="32" rx="0" fill="url(#unknown)" stroke="#ffffff"/><text x="72" y="478" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Final usage</text><text x="72" y="513" font-size="28" fill="#235e43" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">37</text><text x="147" y="510" font-size="17" fill="#526057" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">92.5%</text><text x="363" y="478" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Partial usage</text><text x="363" y="513" font-size="28" fill="#76512e" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="438" y="510" font-size="17" fill="#526057" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">5.0%</text><text x="646" y="478" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Usage missing</text><text x="646" y="513" font-size="28" fill="#526057" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="721" y="510" font-size="17" fill="#526057" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">2.5%</text><text x="72" y="555" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Partial counts are retained with finality; missing fields remain unavailable.</text><rect x="48" y="600" width="894" height="225" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="72" y="635" font-size="20" fill="#121714" font-weight="600" text-anchor="start">Price coverage</text><text x="918" y="635" font-size="14" fill="#526057" font-weight="400" text-anchor="end">Denominator: 37 complete observations</text><rect x="72" y="661" width="731.6756756756756" height="28" rx="0" fill="#235e43" stroke="#ffffff"/><rect x="803.6756756756756" y="661" width="114.32432432432432" height="28" rx="0" fill="url(#unknown)" stroke="#ffffff"/><text x="72" y="719" font-size="18" fill="#235e43" font-weight="600" text-anchor="start">32 priced</text><text x="918" y="719" font-size="18" fill="#121714" font-weight="600" text-anchor="end">5 unpriced</text><text x="72" y="751" font-size="14" fill="#526057" font-weight="400" text-anchor="start">86.5% priced coverage • tariff SYN-v1 • USD</text><text x="72" y="795" font-size="15" fill="#121714" font-weight="600" text-anchor="start">Known priced subtotal $0.086 + unknown cost for 5 complete observations.</text><rect x="966" y="350" width="426" height="475" rx="14" fill="#ffffff" stroke="#cdd3cc"/><text x="990" y="384" font-size="20" fill="#121714" font-weight="600" text-anchor="start">Interpretation guardrails</text><text x="990" y="424" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Reasoning share</text><text x="990" y="458" font-size="27" fill="#121714" font-weight="600" text-anchor="start">Not reported</text><text x="990" y="485" font-size="15" fill="#526057" font-weight="400" text-anchor="start">Unknown does not mean 0%.</text><line x1="990" y1="510" x2="1368" y2="510" stroke="#cdd3cc" stroke-width="1"/><text x="990" y="543" font-size="19" fill="#235e43" font-weight="600" text-anchor="start">Missing ≠ zero</text><text x="990" y="570" font-size="15" fill="#526057" font-weight="400" text-anchor="start">No gap filling with invented counts.</text><text x="990" y="597" font-size="15" fill="#526057" font-weight="400" text-anchor="start">No ranking of quality from token volume.</text><line x1="990" y1="623" x2="1368" y2="623" stroke="#cdd3cc" stroke-width="1"/><text x="990" y="656" font-size="14" fill="#526057" font-weight="400" text-anchor="start">Content capture</text><rect x="990" y="672" width="100" height="30" rx="15" fill="#235e43" stroke="#235e43"/><text x="1040.0" y="692" font-size="12" fill="#f3f4ef" font-weight="600" text-anchor="middle">OFF</text><text x="1104" y="693" font-size="15" fill="#121714" font-weight="400" text-anchor="start">Counts and status only</text><text x="990" y="738" font-size="16" fill="#121714" font-weight="600" text-anchor="start">Cost is a known subtotal.</text><text x="990" y="765" font-size="14" fill="#526057" font-weight="400" text-anchor="start">It excludes unpriced and unobserved usage.</text><text x="990" y="792" font-size="14" fill="#526057" font-weight="400" text-anchor="start">This view is not an invoice reconciliation.</text><line x1="48" y1="845" x2="1392" y2="845" stroke="#cdd3cc" stroke-width="1"/><text x="48" y="873" font-size="13" fill="#526057" font-weight="400" text-anchor="start">Every ratio names its denominator • missing and partial observations remain visible.</text><text x="1392" y="873" font-size="12" fill="#235e43" font-weight="600" text-anchor="end">PROPOSED • SYNTHETIC DATA • NOT IMPLEMENTED</text></g></svg>
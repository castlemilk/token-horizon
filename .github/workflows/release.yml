name: release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). Blank = next patch after the latest v* tag."
        required: false
        type: string

permissions:
  contents: write

# Releases serialize: two rapid main pushes must never race on the same
# computed version (queued, not cancelled).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    # Opt-in: a push to main releases only when the head commit message
    # carries a release token — `[release]` (patch), `[release minor]`,
    # `[release major]`. Everything else (docs, WIP, ordinary fixes) lands
    # without a release. The pipeline's own `release v…`/`release metadata…`
    # commits contain no token and never retrigger; GITHUB_TOKEN pushes
    # wouldn't retrigger anyway.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || (github.ref_name == 'main'
          && github.event_name == 'push'
          && (contains(github.event.head_commit.message, '[release]')
              || contains(github.event.head_commit.message, '[release ')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag history needed for semver resolution on dispatch

      - name: Select Xcode
        run: |
          # Pick the newest installed Xcode: pinned 16.2 (Swift 6.0) can no
          # longer resolve grpc-swift 1.27+, which needs swift-tools 6.1.
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          swift --version

      # The app must ALWAYS ship with its gateway proxy: pin the toolchain
      # (version follows gateway/go.mod) and let make-app.sh fail hard if
      # the sidecar build or bundle verification breaks.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      - name: Resolve signing credentials
        id: creds
        run: |
          if [ -n "${{ secrets.APPLE_CERT_P12_BASE64 }}" ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERT_P12_BASE64 not set — packaging an ad-hoc, un-notarized build"
          fi

      - name: Import Developer ID certificate + notary key
        if: steps.creds.outputs.signed == '1'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            echo -n "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER=${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}" >> "$GITHUB_ENV"
          else
            echo "NOTARY_APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_TEAM_ID=${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_APP_PASSWORD=${{ secrets.APPLE_APP_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Resolve release version
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            # Main push (opt-in via [release] token) or blank dispatch:
            # next patch after the latest tag. [release minor] /
            # [release major] upgrade the bump; [release X.Y.Z] pins an
            # explicit version.
            EXPLICIT="$(printf '%s' "${HEAD_MSG:-}" | sed -n 's/.*\[release \([0-9][0-9.]*[0-9]\)\].*/\1/p')"
            if [ -n "$EXPLICIT" ]; then
              V="$EXPLICIT"; echo "explicit version from commit token: $V"
            else
              BUMP=patch
              case "${HEAD_MSG:-}" in
                *"[release major]"*) BUMP=major ;;
                *"[release minor]"*) BUMP=minor ;;
              esac
              LATEST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
              LATEST="${LATEST#v}"; LATEST="${LATEST:-0.0.0}"
              IFS='.' read -r MA MI PA <<< "$LATEST"
              case "$BUMP" in
                major) V="$(( ${MA:-0} + 1 )).0.0" ;;
                minor) V="${MA:-0}.$(( ${MI:-0} + 1 )).0" ;;
                *)     V="${MA:-0}.${MI:-0}.$(( ${PA:-0} + 1 ))" ;;
              esac
              echo "auto-bump: $BUMP (latest v${LATEST})"
            fi
          fi
          # Strict X.Y.Z — a malformed tag or input must fail before packaging.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::'$V' is not a semantic version (want X.Y.Z)"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved version: $V"

      # Non-tag triggers (main auto-bump, manual dispatch): the tag doesn't
      # exist yet — release.sh syncs the version pins, commits "release
      # vX.Y.Z", tags, and pushes main + tag. Its own GITHUB_TOKEN pushes do
      # not retrigger this workflow (and the job guard would skip them).
      - name: Commit version pins + tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A queued main-push run sits on a commit main has since passed
          # (the earlier run's release commits) — rebase onto the tip so
          # the pin commit fast-forwards.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git fetch origin main
            git rebase origin/main
          fi
          ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Build + sign + notarize + package
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/package-notarized.sh

      - name: Clean up keychain
        if: always() && steps.creds.outputs.signed == '1'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Render product film (best effort)
        run: |
          if [ -d video ]; then
            cd video && npm ci --no-audit --no-fund || exit 0
            npx --no-install remotion render TokenHorizonFilm --output "../dist/TokenHorizon-film.mp4" || echo "film render skipped (non-fatal)"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag: identical to the trigger tag on tag pushes; on
          # manual dispatch it creates vX.Y.Z at the checked-out commit.
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            dist/TokenHorizon-*.zip
            dist/TokenHorizon-*.dmg
            dist/TokenHorizon-*.sha256
            dist/TokenHorizon-film.mp4
          fail_on_unmatched_files: false
          generate_release_notes: true
          # Full release (not prerelease): install.sh, the landing page, and
          # README film embeds all resolve through /releases/latest, which
          # skips prereleases. Preview status lives in the notes instead.
          prerelease: false

      # --- Homebrew cask: update sha256 + sync the tap -------------------------
      # The cask sha256 can only exist post-build, so the repo file is updated
      # here (committed back to main) and castlemilk/homebrew-tap is synced
      # when TAP_GITHUB_TOKEN (PAT with repo access to the tap) is configured.
      - name: Check tap credentials
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then echo "enabled=1" >> "$GITHUB_OUTPUT"; else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            # Tokenless by design: the cask is still committed to this repo;
            # `task brew-sync` publishes it to the tap with local credentials.
            echo "::notice::no TAP_GITHUB_TOKEN — cask committed here; run task brew-sync to publish the tap"
          fi

      - name: Update cask sha256 and sync tap
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SHA_FILE="dist/TokenHorizon-${V}.sha256"
          [ -f "$SHA_FILE" ] || { echo "::error::no checksum file $SHA_FILE"; exit 1; }
          ZIP_SHA="$(awk '/\.zip$/{print $1; exit}' "$SHA_FILE")"
          [ -n "$ZIP_SHA" ] || { echo "::error::no zip sha in $SHA_FILE"; exit 1; }

          CASK="packaging/homebrew/token-horizon.rb"
          sed -i '' -E "s/^  version \"[0-9]+\.[0-9]+\.[0-9]+\"/  version \"${V}\"/" "$CASK"
          sed -i '' -E "s/^  sha256 \"[0-9a-f]+\"/  sha256 \"${ZIP_SHA}\"/" "$CASK"
          grep -q "version \"${V}\"" "$CASK" && grep -q "sha256 \"${ZIP_SHA}\"" "$CASK"

          # Converge the version pins too — release.sh already sets them for
          # tag-triggered runs (no-op then), but a manual dispatch skips it.
          sed -i '' -E "s/^VERSION=\"\\\$\{MARKETING_VERSION:-[0-9]+\.[0-9]+\.[0-9]+\}\"/VERSION=\"\\\${MARKETING_VERSION:-${V}}\"/" scripts/make-app.sh
          sed -i '' -E "s/fallback: \"[0-9]+\.[0-9]+\.[0-9]+\"/fallback: \"${V}\"/" Sources/TokenHorizon/App/BuildInfo.swift

          # Keep the in-repo metadata accurate (post-tag commit).
          if ! git diff --quiet -- "$CASK" scripts/make-app.sh Sources/TokenHorizon/App/BuildInfo.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$CASK" scripts/make-app.sh Sources/TokenHorizon/App/BuildInfo.swift
            git commit -m "release metadata: v${V} (cask sha256 + version pins) [skip ci]"
            git push origin HEAD:main || echo "::warning::release-metadata push to main failed — run scripts/sync-homebrew-tap.sh manually"
          fi

          # Sync the tap over HTTPS when a PAT is available.
          if [ "${{ steps.tap.outputs.enabled }}" = "1" ]; then
            TAP_DIR="$(mktemp -d)/tap"
            git clone "https://x-access-token:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/castlemilk/homebrew-tap.git" "$TAP_DIR"
            mkdir -p "$TAP_DIR/Casks"
            cp "$CASK" "$TAP_DIR/Casks/token-horizon.rb"
            if git -C "$TAP_DIR" diff --quiet -- Casks/token-horizon.rb 2>/dev/null; then
              echo "tap already current"
            else
              git -C "$TAP_DIR" add Casks/token-horizon.rb
              git -C "$TAP_DIR" -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "token-horizon ${V}"
              git -C "$TAP_DIR" push
              echo "published token-horizon ${V} to castlemilk/homebrew-tap"
            fi
          fi

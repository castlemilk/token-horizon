name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "New version X.Y.Z; blank selects the next patch."
        required: false
        type: string
      release_tag:
        description: "Existing unreleased tag vX.Y.Z to resume or backfill. Leave version blank."
        required: false
        type: string
      desktop_installers:
        description: "Also build and attach Linux/Windows installers after the native Mac release."
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build-and-release:
    concurrency:
      group: release
      queue: max
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      release_tag: ${{ steps.ver.outputs.tag }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || (github.ref_name == 'main' && github.event_name == 'push'
          && (contains(github.event.head_commit.message, '[release]')
              || contains(github.event.head_commit.message, '[release ')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve release version from the shared CLI
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            REQUESTED_TAG="$GITHUB_REF_NAME"
            CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
            # Checkout may represent an annotated event tag as a lightweight
            # local ref. Restore its remote tag object before the shared fetch,
            # while refusing a tag whose source commit moved after checkout.
            git fetch --no-tags origin "+refs/tags/$REQUESTED_TAG:refs/tags/$REQUESTED_TAG"
            if [ "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" != "$CHECKED_OUT_COMMIT" ]; then
              echo '::error::The remote release tag differs from the checked-out source commit'
              exit 1
            fi
          fi
          if [ -z "$REQUESTED_TAG" ]; then
            # Queued releases start from the current main tip. Never rebase or
            # push an obsolete trigger checkout over newer repository history.
            git fetch origin main --tags
            git checkout --detach origin/main
          fi
          node scripts/release.mjs resolve --version "$REQUESTED_VERSION" --tag "$REQUESTED_TAG" --message "$HEAD_MSG" --format github >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_TAG" ]; then echo 'existing_tag=1' >> "$GITHUB_OUTPUT"; else echo 'existing_tag=0' >> "$GITHUB_OUTPUT"; fi
      - name: Commit canonical native pins and atomically push the release tag
        if: steps.ver.outputs.existing_tag == '0'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.mjs release "$RELEASE_VERSION" --ci
      - name: Check out and validate the exact unreleased tag
        id: source
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_TAG"
          node scripts/release.mjs preflight "$RELEASE_VERSION" --tag --allow-backfill
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: Provision Rust for the bundled Metal engine
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - name: Validate release policy and desktop authentication
        run: |
          node --test scripts/test-release.mjs scripts/test-install-release.mjs
          # Historical unreleased tags predate the optional transport suite.
          if [ -f scripts/test-notarization.mjs ]; then node --test scripts/test-notarization.mjs; fi
          npm ci --prefix cloudflare --ignore-scripts --no-audit --no-fund
          node --test cloudflare/worker.test.mjs cloudflare/browser-auth.test.mjs cloudflare/desktop-auth.test.mjs
      - name: Validate native app and gateway
        run: |
          (cd clients/macos && swift test)
          (cd gateway && test -z "$(gofmt -l .)" && go vet ./... && go test ./...)
      - name: Resolve complete signing credentials
        id: creds
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo '::error::Production releases require the Developer ID certificate and notarization credentials'
            exit 1
          fi
          [ -n "$CERT_PASSWORD" ] && [ -n "$KEYCHAIN_PASSWORD" ] || { echo '::error::Certificate and keychain passwords are required'; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          umask 077
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before.txt"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          python3 - "$RUNNER_TEMP/keychains-before.txt" "$KEYCHAIN" <<'PY'
          import shlex, subprocess, sys
          with open(sys.argv[1]) as f: paths = shlex.split(f.read())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[2], *paths], check=True)
          PY
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p')"
          [ -n "$IDENTITY" ] && [ "$(printf '%s\n' "$IDENTITY" | wc -l | tr -d ' ')" = 1 ] || { echo '::error::Expected exactly one valid Developer ID Application identity'; exit 1; }
          # Fail quickly if noninteractive private-key access or timestamping
          # is unavailable, before the production build reaches widget signing.
          python3 - "$IDENTITY" "$KEYCHAIN" "$RUNNER_TEMP/signing-probe" <<'PY'
          import os, shutil, subprocess, sys
          identity, keychain, probe = sys.argv[1:]
          shutil.copyfile('/usr/bin/true', probe)
          os.chmod(probe, 0o700)
          try:
              subprocess.run(['/usr/bin/codesign', '--force', '--sign', identity,
                              '--keychain', keychain, '--options', 'runtime',
                              '--timestamp', probe], check=True, timeout=90)
              subprocess.run(['/usr/bin/codesign', '--verify', '--strict', probe],
                             check=True, timeout=30)
          except subprocess.TimeoutExpired:
              raise SystemExit('Signing probe timed out: check codesign keychain access and Apple timestamp connectivity')
          finally:
              os.unlink(probe)
          PY
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
          echo 'REQUIRE_NOTARIZATION=1' >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ] || { echo '::error::API key ID and issuer are required'; exit 1; }
            printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
          else
            [ -z "$API_KEY_ID$API_ISSUER" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM" ] && [ -n "$APPLE_PASSWORD" ] || { echo '::error::Complete Apple-ID notary credentials are required'; exit 1; }
            echo "NOTARY_APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "NOTARY_TEAM_ID=$APPLE_TEAM" >> "$GITHUB_ENV"
            echo "NOTARY_APP_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo 'signed=1' >> "$GITHUB_OUTPUT"
      - name: Build, sign, notarize and validate ZIP and DMG
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          RELEASE_BUILD: "1"
        run: ./scripts/package-notarized.sh
      - name: Clean up signing material and restore keychains
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/keychains-before.txt" ]; then
            python3 - "$RUNNER_TEMP/keychains-before.txt" <<'PY'
          import shlex, subprocess, sys
          with open(sys.argv[1]) as f: paths = shlex.split(f.read())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *paths], check=True)
          PY
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/keychains-before.txt" "$RUNNER_TEMP/signing-probe"
      - name: Render product film (best effort)
        run: |
          if [ -d video ]; then
            (cd video && npm ci --no-audit --no-fund && npx --no-install remotion render TokenHorizonFilm --output ../dist/TokenHorizon-film.mp4) || echo 'Film rendering skipped'
          fi
      - name: Validate exact release assets
        id: assets
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          node scripts/release.mjs preflight "$RELEASE_VERSION" --tag --allow-backfill
          [ "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" ]
          node --input-type=module <<'JS'
          import { readFileSync, statSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const version = process.env.RELEASE_VERSION;
          const prefix = `TokenHorizon-${version}`, files = [`${prefix}.zip`, `${prefix}.dmg`];
          const manifest = readFileSync(`dist/${prefix}.sha256`, 'utf8').trim().split(/\r?\n/);
          if (manifest.length !== 2) throw new Error('Checksum manifest must contain exactly ZIP and DMG');
          const records = new Map(manifest.map(line => { const match = line.match(/^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$/); if (!match) throw new Error('Invalid checksum line'); return [match[2],match[1]]; }));
          if (records.size !== 2 || files.some(name => !records.has(name))) throw new Error('Unexpected checksum assets');
          for (const name of files) {
            if (!statSync(`dist/${name}`).isFile()) throw new Error(`Missing artifact: ${name}`);
            const bytes = readFileSync(`dist/${name}`);
            if (!bytes.length || createHash('sha256').update(bytes).digest('hex') !== records.get(name)) throw new Error(`Checksum mismatch: ${name}`);
          }
          const paths = files.map(name => `dist/${name}`).concat(`dist/${prefix}.sha256`);
          try { if (statSync('dist/TokenHorizon-film.mp4').size > 0) paths.push('dist/TokenHorizon-film.mp4'); } catch {}
          appendFileSync(process.env.GITHUB_OUTPUT, `files<<RELEASE_ASSETS\n${paths.join('\n')}\nRELEASE_ASSETS\n`);
          JS
      - name: Stage validated native assets in a draft
        id: draft
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.commit }}
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          draft: true
          prerelease: false
      - name: Verify uploaded ZIP, DMG and checksum before publication
        id: published
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, statSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY, id = process.env.RELEASE_ID, version = process.env.RELEASE_VERSION;
          const api = (path) => JSON.parse(execFileSync('gh',['api',path],{encoding:'utf8'}));
          const release = api(`repos/${repo}/releases/${id}`);
          assert.equal(release.tag_name, process.env.RELEASE_TAG);
          assert.equal(release.draft, true); assert.equal(release.prerelease, false);
          const assets = api(`repos/${repo}/releases/${id}/assets?per_page=100`);
          for (const suffix of ['zip','dmg','sha256']) {
            const name = `TokenHorizon-${version}.${suffix}`, matches = assets.filter(asset => asset.name === name);
            assert.equal(matches.length, 1, `Expected one uploaded ${name}`);
            assert.equal(matches[0].state, 'uploaded');
            assert.equal(matches[0].size, statSync(`dist/${name}`).size);
            const digest = 'sha256:' + createHash('sha256').update(readFileSync(`dist/${name}`)).digest('hex');
            assert.equal(matches[0].digest, digest, `Uploaded checksum mismatch: ${name}`);
          }
          const releases = JSON.parse(execFileSync('gh',['api','--paginate','--slurp',`repos/${repo}/releases?per_page=100`],{encoding:'utf8'})).flat();
          const newer = releases.some(r => !r.draft && !r.prerelease && /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(r.tag_name) && Number(execFileSync('node',['scripts/release.mjs','compare',r.tag_name.slice(1),version],{encoding:'utf8'})) > 0);
          execFileSync('gh',['api','--method','PATCH',`repos/${repo}/releases/${id}`,'--input','-'],{input:JSON.stringify({draft:false,prerelease:false,make_latest:newer?'false':'true'}),stdio:['pipe','inherit','inherit']});
          appendFileSync(process.env.GITHUB_OUTPUT, `latest=${!newer}\n`);
          JS
      - name: Update cask checksum from fresh main without changing version pins
        if: steps.published.outputs.latest == 'true'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CASK_SOURCE="$RUNNER_TEMP/release-cask.rb"
          ZIP_SHA="$(awk '/\.zip$/{print $1}' "dist/TokenHorizon-${RELEASE_VERSION}.sha256")"
          git fetch origin main
          git checkout --detach origin/main
          if ! node scripts/release.mjs check "$RELEASE_VERSION"; then
            echo '::notice::Main has advanced to another version; leaving its cask and pins untouched'
            exit 0
          fi
          CASK=packaging/homebrew/token-horizon.rb
          RELEASE_ZIP_SHA="$ZIP_SHA" python3 - "$CASK" <<'PY'
          import os, re, sys
          path = sys.argv[1]
          with open(path) as f: text = f.read()
          text, count = re.subn(r'^  sha256 "[a-f0-9]{64}"$', '  sha256 "' + os.environ['RELEASE_ZIP_SHA'] + '"', text, flags=re.M)
          if count != 1: raise SystemExit('Expected exactly one cask checksum pin')
          with open(path, 'w') as f: f.write(text)
          PY
          cp "$CASK" "$CASK_SOURCE"
          if ! git diff --quiet -- "$CASK"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$CASK"
            git commit -m "release metadata: v${RELEASE_VERSION} (cask checksum) [skip ci]"
            git push origin HEAD:main
          fi
          if [ -z "$TAP_TOKEN" ]; then echo '::notice::No TAP_GITHUB_TOKEN; cask is updated in this repository'; exit 0; fi
          TAP_WORK="$(mktemp -d)"
          trap 'rm -rf "$TAP_WORK" "$CASK_SOURCE"' EXIT
          # Keep the PAT out of clone URLs, process arguments and git remotes.
          GH_TOKEN="$TAP_TOKEN" gh api repos/castlemilk/homebrew-tap/contents/Casks/token-horizon.rb > "$TAP_WORK/cask.json"
          python3 - "$TAP_WORK/cask.json" "$CASK_SOURCE" "$TAP_WORK/update.json" "$RELEASE_VERSION" <<'PY'
          import base64, json, re, subprocess, sys
          with open(sys.argv[1]) as f: existing = json.load(f)
          with open(sys.argv[2], 'rb') as f: current = f.read()
          previous = base64.b64decode(existing['content'])
          version = re.search(rb'^  version "([0-9]+\.[0-9]+\.[0-9]+)"$', previous, re.M)
          if not version: raise SystemExit('Tap cask lacks a canonical version pin')
          compared = subprocess.check_output(['node', 'scripts/release.mjs', 'compare', version[1].decode(), sys.argv[4]], text=True).strip()
          if compared == '1': raise SystemExit('Refusing to downgrade the tap cask')
          if previous == current:
              open(sys.argv[3], 'w').close()
              raise SystemExit(0)
          content = base64.b64encode(current).decode()
          with open(sys.argv[3], 'w') as f: json.dump({'message':'token-horizon ' + sys.argv[4], 'content':content, 'sha':existing['sha']}, f)
          PY
          if [ -s "$TAP_WORK/update.json" ]; then
            GH_TOKEN="$TAP_TOKEN" gh api --method PUT repos/castlemilk/homebrew-tap/contents/Casks/token-horizon.rb --input "$TAP_WORK/update.json" >/dev/null
          fi

  desktop-installers:
    needs: build-and-release
    # Native releases are the default. Preserve the tested cross-platform
    # workflow for an explicit manual opt-in without widening a tag release.
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_installers && needs.build-and-release.outputs.release_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      release_tag: ${{ needs.build-and-release.outputs.release_tag }}
      publish: true

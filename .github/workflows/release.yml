name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the newest installed Xcode: pinned 16.2 (Swift 6.0) can no
          # longer resolve grpc-swift 1.27+, which needs swift-tools 6.1.
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          swift --version

      # The app must ALWAYS ship with its gateway proxy: pin the toolchain
      # (version follows gateway/go.mod) and let make-app.sh fail hard if
      # the sidecar build or bundle verification breaks.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      - name: Resolve signing credentials
        id: creds
        run: |
          if [ -n "${{ secrets.APPLE_CERT_P12_BASE64 }}" ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERT_P12_BASE64 not set — packaging an ad-hoc, un-notarized build"
          fi

      - name: Import Developer ID certificate + notary key
        if: steps.creds.outputs.signed == '1'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            echo -n "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=${{ secrets.APPLE_API_KEY_ID || vars.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER=${{ secrets.APPLE_API_ISSUER_ID || vars.APPLE_API_ISSUER_ID }}" >> "$GITHUB_ENV"
          else
            echo "NOTARY_APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_TEAM_ID=${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_APP_PASSWORD=${{ secrets.APPLE_APP_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build + sign + notarize + package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/package-notarized.sh

      - name: Clean up keychain
        if: always() && steps.creds.outputs.signed == '1'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Render product film (best effort)
        run: |
          if [ -d video ]; then
            cd video && npm ci --no-audit --no-fund || exit 0
            npx --no-install remotion render TokenHorizonFilm --output "../dist/TokenHorizon-film.mp4" || echo "film render skipped (non-fatal)"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TokenHorizon-*.zip
            dist/TokenHorizon-*.dmg
            dist/TokenHorizon-*.sha256
            dist/TokenHorizon-film.mp4
          fail_on_unmatched_files: false
          generate_release_notes: true
          # Full release (not prerelease): install.sh, the landing page, and
          # README film embeds all resolve through /releases/latest, which
          # skips prereleases. Preview status lives in the notes instead.
          prerelease: false

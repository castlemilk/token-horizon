name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI is the fast feedback gate (lint errors + full XCTest suite).
# Releases stay on tag-driven release.yml, which builds via
# scripts/make-app.sh (the ONLY supported launcher path).
jobs:
  lint-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the newest installed Xcode: pinned 16.2 (Swift 6.0) can no
          # longer resolve grpc-swift 1.27+, which needs swift-tools 6.1.
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          swift --version

      - name: Install SwiftLint
        run: brew install swiftlint || brew upgrade swiftlint || true

      - name: Lint (errors fail, warnings burn down)
        run: swiftlint lint

      - name: Test (unit + perf budgets + integration)
        run: swift test

  gateway:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      - name: Format check
        run: test -z "$(gofmt -l gateway/)"

      - name: Vet + test
        run: cd gateway && go vet ./... && go test ./...

  coverage:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the newest installed Xcode: pinned 16.2 (Swift 6.0) can no
          # longer resolve grpc-swift 1.27+, which needs swift-tools 6.1.
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          swift --version

      # Coverage is REPORT-ONLY by design: this suite exercises live
      # machine state (displays, keychain, running tools), so absolute
      # percentages differ between CI and dev machines. A hard gate would
      # just be a flake factory. Budgets (not coverage %) are the gate.
      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Coverage summary (Sources/ only)
        run: |
          BIN=".build/arm64-apple-macosx/debug/token-horizonPackageTests.xctest/Contents/MacOS/token-horizonPackageTests"
          PROF=$(find .build -name default.profdata | head -1)
          xcrun llvm-cov report "$BIN" -instr-profile "$PROF" 2>/dev/null \
            | grep -E "Filename|Sources/TokenHorizon|TOTAL" || true

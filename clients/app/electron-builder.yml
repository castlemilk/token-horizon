appId: dev.token-horizon.desktop
productName: Token Horizon
executableName: token-horizon
asar: true
directories:
  buildResources: resources/build
  output: dist
files:
  - out/**
  - package.json
  - resources/build/icon.png
extraResources:
  - from: resources/daemon
    to: daemon
    filter:
      - token-horizon-daemon
      - token-horizon-daemon.exe
      - build-info.json
afterPack: scripts/after-pack.cjs
artifactName: TokenHorizon-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/build/icon.ico
nsis:
  artifactName: TokenHorizon-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Token Horizon
  uninstallDisplayName: Token Horizon
  createDesktopShortcut: always
mac:
  target: dmg
  icon: resources/build/icon.icns
  entitlementsInherit: resources/build/entitlements.mac.plist
  notarize: false
linux:
  syncDesktopName: true
  target:
    - AppImage
    - deb
  icon: resources/build/icon.png
  maintainer: Token Horizon
  vendor: Token Horizon
  category: Utility
  synopsis: Local AI usage, plan limits, and machine observability
appImage:
  executableArgs: []
npmRebuild: false

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title></title>
		<script>
			// Apply a persisted theme override before first paint (no FOUC).
			(function () {
				try {
					var t = localStorage.getItem('token-horizon.theme');
					if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Splash: inline + self-contained so it paints before the JS bundle.
		     Removed by +layout.svelte once the app has mounted and the first
		     health check resolved (see #th-splash). -->
		<div id="th-splash" aria-hidden="true">
			<div class="sp-mark"></div>
			<div class="sp-bar"><div class="sp-fill"></div></div>
		</div>
		<style>
			#th-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				background: light-dark(#fafafb, #0f0f11);
				color: light-dark(#1c1c21, #e8e8ec);
				font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, sans-serif;
				z-index: 9999;
				transition: opacity 0.25s ease;
			}
			#th-splash.sp-done {
				opacity: 0;
				pointer-events: none;
			}
			#th-splash .sp-mark {
				width: 14px;
				height: 14px;
				border-radius: 4px;
				background: light-dark(#26262c, #dcdce2);
			}
			#th-splash .sp-bar {
				width: 120px;
				height: 3px;
				border-radius: 2px;
				background: light-dark(rgb(0 0 0 / 0.07), rgb(255 255 255 / 0.08));
				overflow: hidden;
			}
			#th-splash .sp-fill {
				height: 100%;
				width: 40%;
				border-radius: inherit;
				background: light-dark(#26262c, #dcdce2);
				animation: th-splash-slide 1.1s ease-in-out infinite;
			}
			@keyframes th-splash-slide {
				0% { transform: translateX(-110%); }
				100% { transform: translateX(320%); }
			}
		</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
